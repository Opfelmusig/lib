name: Publish Package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun ci

      - name: Type check
        run: bun typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Set package version
        run: |
          bun pm version \
            "0.0.0-ci.${GITHUB_RUN_NUMBER}.sha-${GITHUB_SHA::7}" \
            --no-git-tag-version

      - name: Publish
        run: npm publish
